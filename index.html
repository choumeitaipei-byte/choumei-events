<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>洲美扶輪社－近期活動報名</title>
<style>
  :root{
    --navy:#1F3864; --navy2:#2E4A7D; --gold:#FFD966; --gold2:#C9A227;
    --bg:#F3F5FA; --card:#FFFFFF; --line:#D6DCE8; --text:#1E2430; --muted:#5B6475;
    --ok:#1E7B4A; --okbg:#E3F4EA; --no:#9A3B2E; --nobg:#FBE9E5;
  }
  *{box-sizing:border-box}
  html{font-size:18px}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;line-height:1.6}
  header{background:var(--navy);color:#fff;padding:28px 20px 24px;text-align:center}
  header h1{margin:0;font-size:1.6rem;letter-spacing:.05em}
  header p{margin:8px 0 0;color:var(--gold);font-size:1rem}
  main{max-width:760px;margin:0 auto;padding:16px 14px 120px}
  .step{font-size:1.25rem;font-weight:700;color:var(--navy);margin:26px 4px 10px;display:flex;align-items:center;gap:10px}
  .step span{background:var(--navy);color:var(--gold);border-radius:50%;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;font-size:1.05rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  label.field{display:block;margin:12px 0 4px;font-weight:700}
  input[type=text],select,textarea{width:100%;font-size:1.05rem;padding:12px 14px;border:2px solid var(--line);border-radius:10px;font-family:inherit;background:#fff}
  input[type=text]:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy2)}
  .seg{display:flex;gap:10px;flex-wrap:wrap}
  .seg button,.choice button{flex:1;min-width:130px;font-size:1.1rem;font-family:inherit;font-weight:700;padding:14px 10px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--text);cursor:pointer}
  .seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .hide{display:none!important}

  .ev{padding:0;overflow:hidden}
  .ev-head{background:var(--navy);color:#fff;padding:14px 18px}
  .ev-tag{color:var(--gold);font-size:1.35rem;font-weight:800;letter-spacing:.03em}
  .ev-title{font-size:1.2rem;font-weight:700;margin-top:2px}
  .ev-body{padding:14px 18px 18px}
  .info{display:grid;grid-template-columns:4.2em 1fr;gap:4px 10px;margin:0 0 14px}
  .info dt{font-weight:700;color:var(--muted)}
  .info dd{margin:0}
  .choice{display:flex;gap:10px;flex-wrap:wrap}
  .choice button.yes.on{background:var(--ok);border-color:var(--ok);color:#fff}
  .choice button.no.on{background:var(--no);border-color:var(--no);color:#fff}
  .extra{margin-top:14px;padding:14px;border-radius:12px;background:var(--okbg);border:1px dashed #9CCFB2}
  .extra .row{display:flex;gap:10px;flex-wrap:wrap}
  .extra .row > div{flex:1;min-width:150px}
  .opts{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
  .opts label{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 14px;font-size:1.05rem;cursor:pointer}
  .opts input{width:22px;height:22px}
  .fee{margin-top:12px;font-size:1.15rem;font-weight:800;color:var(--navy)}
  .closed{opacity:.55}
  .closed-note{font-weight:700;color:var(--no)}

  .list{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
  .list h4{margin:0 0 6px;font-size:1.05rem;color:var(--navy)}
  .list ol{margin:0;padding-left:1.8em}
  .list li{margin:2px 0}
  .list .leave{margin-top:8px;color:var(--muted)}
  .list .empty{color:var(--muted)}

  .submit-bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:12px 14px;display:flex;justify-content:center}
  .submit-bar button{width:100%;max-width:760px;font-size:1.3rem;font-weight:800;font-family:inherit;padding:16px;border:none;border-radius:14px;background:var(--gold2);color:#fff;cursor:pointer}
  .submit-bar button:disabled{background:#AAB2C0;cursor:wait}
  .msg{border-radius:12px;padding:14px 16px;margin:14px 0;font-weight:700}
  .msg.err{background:var(--nobg);color:var(--no)}
  .msg.ok{background:var(--okbg);color:var(--ok)}
  .msg ul{margin:6px 0 0;padding-left:1.4em;font-weight:400;color:var(--text)}
  .warn{background:#FFF4D6;border:1px solid var(--gold2);color:#6B5200;border-radius:12px;padding:12px 14px;margin:14px 0}
</style>
</head>
<body>
<header>
  <h1>洲美扶輪社<br>近期活動報名</h1>
  <p>填一次資料，就能同時報名多個活動</p>
</header>

<main>
  <div id="configWarn" class="warn hide">⚠️ 尚未設定後台網址（API_URL），目前無法送出報名。</div>
  <div id="topMsg"></div>

  <div class="step"><span>1</span>個人資料</div>
  <div class="card">
    <label class="field">身分</label>
    <div class="seg" id="identitySeg">
      <button type="button" data-v="社友" class="on">扶輪社友</button>
      <button type="button" data-v="來賓">一般來賓</button>
    </div>

    <div id="memberFields">
      <label class="field" for="nickname">Nickname（英文名）</label>
      <input type="text" id="nickname" placeholder="例：Maya" autocomplete="nickname">
      <label class="field" for="name">中文姓名</label>
      <input type="text" id="name" placeholder="例：許采葳" autocomplete="name">
    </div>

    <div id="guestFields" class="hide">
      <label class="field" for="gname">姓名</label>
      <input type="text" id="gname" placeholder="請填寫您的姓名">
      <label class="field" for="inviter">邀請人</label>
      <input type="text" id="inviter" placeholder="邀請您的社友">
      <label class="field" for="company">公司及職稱（選填）</label>
      <input type="text" id="company">
    </div>
  </div>

  <div class="step"><span>2</span>選擇活動（可以選好幾個）</div>
  <div id="events"></div>
</main>

<div class="submit-bar"><button type="button" id="submitBtn">確認送出</button></div>

<script>
/* ======== 設定：貼上 Apps Script 網頁應用程式網址 ======== */
const API_URL = 'PASTE_APPS_SCRIPT_URL_HERE';

/* ======== 活動清單（依日期排序；新增活動時請整份重新排序） ======== */
const EVENTS = [
  { code:'A', date:'2026-12-05', tag:'【A】12/5（六）', title:'洲美服務活動－CCSA義賣',
    info:[['時間','11:00–21:00<br>社內協助時段：11–16、16–21'],['地點','香提廣場'],
          ['說明','協助CCSA義賣，本社也準備了義賣品，賣出所得全額提供給CCSA，請各位社友一起來協助義賣']],
    yes:'我要參加', no:'不克參加', extras:['slot'] },
  { code:'B', date:'2026-12-06', tag:'【B】12/6（日）', title:'洲美社自行車一日遊—大稻埕～碧潭',
    info:[['集合','08:00 大稻埕廣場'],['午餐','碧潭大廚上菜餐廳'],['路線','總長約 20.4 公里'],['費用','自費（自行車及午餐費用）']],
    yes:'我要參加', no:'不克參加', extras:['bike','family'] },
  { code:'C', date:'2026-12-08', tag:'【C】12/8（二）', title:'第649次例會－第十四屆社員大會',
    info:[['時間','18:30–20:30'],['地點','台北市商業會'],
          ['說明','本次需要 2/3 社員出席（約40人），請各位社友務必預留時間出席<br>眷屬社友也可以投票']],
    yes:'我要出席', no:'請假', extras:['spouse'] },
  { code:'D', date:'2026-12-19', tag:'【D】12/19（六）', title:'洲美社 歡慶聖誕晚會',
    info:[['時間','18:00–21:00'],['地點','丸滿台灣味手路菜餐廳'],['費用','社友／寶眷／小扶輪 580元<br>來賓 1,180元'],
          ['說明','社友不須另行準備禮物，當天有摸彩、小禮物及點心']],
    yes:'我要參加', no:'不克參加', extras:['family','guest','diet','fee'] },
  { code:'E', date:'2027-01-10', tag:'【E】2027/1/10（日）', title:'地區 2026-27年度保齡球聯誼賽',
    info:[['時間','上午 08:30 報到'],['地點','新喬福保齡球館<br>新北市中和區錦和路388號（TEL 2246-9988）'],['費用','每人 800元']],
    yes:'我要參加', no:'不克參加', extras:['fee'] },
  { code:'F', date:'2027-01-23', tag:'【F】2027/1/23（六）', title:'地區 羽球聯誼賽',
    info:[['時間','08:00 報到、08:30 比賽開始、10:00 開幕式'],['地點','台北體育館 紅館<br>台北市松山區南京東路四段10號7樓'],
          ['費用','團體組（6位，可另備1名替補）4,200元<br>雙人組（2位）1,200元<br>趣味競賽組（2位）600元'],
          ['資格','須為RI登錄完成之社員及其配偶、父母或子女']],
    yes:'我要參加', no:'不克參加', extras:['group','fee'] }
];
const GROUP_FEES = { '團體組':4200, '雙人組':1200, '趣味競賽組':600 };

/* ======== 狀態 ======== */
let identity = '社友';
const choice = {};   // code -> '參加' | '不克參加'
const $ = (s, el=document) => el.querySelector(s);

/* ======== 畫面 ======== */
function countSelect(id, max){
  let h = `<select id="${id}">`;
  for(let i=0;i<=max;i++) h += `<option value="${i}">${i}</option>`;
  return h + '</select>';
}

function extraHTML(ev){
  const c = ev.code, x = ev.extras, out = [];
  if(x.includes('slot')) out.push(`
    <label class="field">可協助的時段（可複選）</label>
    <div class="opts">
      <label><input type="checkbox" name="slot_${c}" value="11–16">11:00–16:00</label>
      <label><input type="checkbox" name="slot_${c}" value="16–21">16:00–21:00</label>
    </div>`);
  if(x.includes('bike')) out.push(`
    <label class="field">自行車</label>
    <div class="opts">
      <label><input type="radio" name="bike_${c}" value="自備單車">自備單車</label>
      <label><input type="radio" name="bike_${c}" value="租借YouBike">租借 YouBike</label>
    </div>`);
  if(x.includes('family')) out.push(`
    <div class="row">
      <div><label class="field" for="bj_${c}">寶眷人數</label>${countSelect('bj_'+c,3)}</div>
      <div><label class="field" for="bjn_${c}">寶眷姓名</label><input type="text" id="bjn_${c}"></div>
    </div>
    <div class="row">
      <div><label class="field" for="kid_${c}">小扶輪人數</label>${countSelect('kid_'+c,6)}</div>
      <div><label class="field" for="kidn_${c}">小扶輪姓名</label><input type="text" id="kidn_${c}"></div>
    </div>`);
  if(x.includes('guest')) out.push(`
    <div class="row">
      <div><label class="field" for="gu_${c}">來賓人數</label>${countSelect('gu_'+c,6)}</div>
      <div><label class="field" for="gun_${c}">來賓姓名</label><input type="text" id="gun_${c}"></div>
    </div>`);
  if(x.includes('spouse')) out.push(`
    <label class="field" for="sp_${c}">一同出席的眷屬社友姓名（若有）</label>
    <input type="text" id="sp_${c}" placeholder="沒有可以不填">`);
  if(x.includes('diet')) out.push(`
    <label class="field">飲食</label>
    <div class="opts">
      <label><input type="radio" name="diet_${c}" value="葷食" checked>葷食</label>
      <label><input type="radio" name="diet_${c}" value="素食">素食</label>
    </div>`);
  if(x.includes('group')) out.push(`
    <label class="field">組別</label>
    <div class="opts">
      <label><input type="radio" name="grp_${c}" value="團體組">團體組（6位）</label>
      <label><input type="radio" name="grp_${c}" value="雙人組">雙人組（2位）</label>
      <label><input type="radio" name="grp_${c}" value="趣味競賽組">趣味競賽組（2位）</label>
    </div>
    <label class="field" for="mate_${c}">隊友姓名</label>
    <input type="text" id="mate_${c}" placeholder="例：Jerry公子懋霖">`);
  if(x.includes('fee')) out.push(`<div class="fee" id="fee_${c}"></div>`);
  return out.join('');
}

function isClosed(ev){
  const end = new Date(ev.date + 'T23:59:59+08:00');
  return Date.now() > end.getTime();
}

function renderEvents(){
  const box = $('#events');
  box.innerHTML = EVENTS.map(ev => {
    const closed = isClosed(ev);
    return `
    <div class="card ev ${closed?'closed':''}" id="ev_${ev.code}">
      <div class="ev-head">
        <div class="ev-tag">${ev.tag}</div>
        <div class="ev-title">${ev.title}</div>
      </div>
      <div class="ev-body">
        <dl class="info">${ev.info.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
        ${closed ? '<div class="closed-note">活動已結束</div>' : `
        <div class="choice">
          <button type="button" class="yes" data-code="${ev.code}" data-v="參加">${ev.yes}</button>
          <button type="button" class="no" data-code="${ev.code}" data-v="不克參加">${ev.no}</button>
        </div>
        <div class="extra hide" id="extra_${ev.code}">${extraHTML(ev)}</div>`}
        <div class="list" id="list_${ev.code}"><span class="empty">名單載入中…</span></div>
      </div>
    </div>`;
  }).join('');

  box.querySelectorAll('.choice button').forEach(b => b.addEventListener('click', () => {
    const c = b.dataset.code, v = b.dataset.v;
    choice[c] = choice[c] === v ? undefined : v;      // 再按一次取消
    const card = $('#ev_'+c);
    card.querySelectorAll('.choice button').forEach(x => x.classList.toggle('on', x.dataset.v === choice[c]));
    const ex = $('#extra_'+c);
    if(ex) ex.classList.toggle('hide', !(choice[c] === '參加' && ex.innerHTML.trim()));
    updateFee(c);
  }));
}

function num(id){ const el = $('#'+id); return el ? parseInt(el.value,10)||0 : 0; }
function val(id){ const el = $('#'+id); return el ? el.value.trim() : ''; }
function radio(name){ const el = document.querySelector(`input[name="${name}"]:checked`); return el ? el.value : ''; }

function calcFee(c){
  if(c === 'D'){
    const self = identity === '來賓' ? 1180 : 580;
    return self + (num('bj_D') + num('kid_D')) * 580 + num('gu_D') * 1180;
  }
  if(c === 'E') return 800;
  if(c === 'F') return GROUP_FEES[radio('grp_F')] || 0;
  return 0;
}

function updateFee(c){
  const el = $('#fee_'+c);
  if(!el) return;
  const f = choice[c] === '參加' ? calcFee(c) : 0;
  el.textContent = f ? `費用試算：${f.toLocaleString()} 元` : (c === 'F' && choice[c] === '參加' ? '請選擇組別' : '');
}

/* ======== 名單 ======== */
function renderLists(lists){
  EVENTS.forEach(ev => {
    const el = $('#list_'+ev.code);
    const L = (lists && lists[ev.code]) || {going:[], leave:[], people:0};
    el.innerHTML = '';
    const h = document.createElement('h4');
    h.textContent = L.going.length ? `目前已報名（${L.going.length} 組／共 ${L.people} 人）` : '目前已報名';
    el.appendChild(h);
    if(L.going.length){
      const ol = document.createElement('ol');
      L.going.forEach(t => { const li = document.createElement('li'); li.textContent = t; ol.appendChild(li); });
      el.appendChild(ol);
    } else {
      const s = document.createElement('div'); s.className = 'empty'; s.textContent = '還沒有人報名，歡迎搶頭香！'; el.appendChild(s);
    }
    if(L.leave.length){
      const d = document.createElement('div'); d.className = 'leave';
      d.textContent = (ev.code === 'C' ? '請假：' : '不克參加：') + L.leave.join('、');
      el.appendChild(d);
    }
  });
}

function loadLists(){
  if(!apiReady()){ renderLists(null); return; }
  fetch(API_URL + '?action=list')
    .then(r => r.json())
    .then(d => { if(d.ok) renderLists(d.lists); else throw new Error(d.error); })
    .catch(() => EVENTS.forEach(ev => { $('#list_'+ev.code).innerHTML = '<span class="empty">名單暫時無法載入，請稍後重新整理。</span>'; }));
}

/* ======== 送出 ======== */
function apiReady(){ return API_URL && !API_URL.startsWith('PASTE'); }

function showMsg(type, html){
  $('#topMsg').innerHTML = `<div class="msg ${type}">${html}</div>`;
  window.scrollTo({top:0, behavior:'smooth'});
}
function esc(s){ return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }

function collect(){
  const p = { identity, events: [] };
  if(identity === '社友'){
    p.nickname = val('nickname'); p.name = val('name');
    if(!p.nickname && !p.name) return '請填寫 Nickname 或中文姓名';
  } else {
    p.name = val('gname'); p.inviter = val('inviter'); p.company = val('company');
    if(!p.name) return '請填寫姓名';
    if(!p.inviter) return '請填寫邀請人';
  }
  for(const ev of EVENTS){
    const c = ev.code, st = choice[c];
    if(!st) continue;
    const e = { code:c, status:st };
    if(st === '參加'){
      const opt = [];
      if(ev.extras.includes('slot')){
        const s = [...document.querySelectorAll(`input[name="slot_${c}"]:checked`)].map(i => i.value);
        if(!s.length) return `${ev.tag} 請勾選可協助的時段`;
        opt.push('協助時段 ' + s.join('、'));
      }
      if(ev.extras.includes('bike')){
        const b = radio('bike_'+c);
        if(!b) return `${ev.tag} 請選擇自備單車或租借 YouBike`;
        opt.push(b);
      }
      if(ev.extras.includes('family')){
        e.bj = num('bj_'+c); e.bjNames = val('bjn_'+c);
        e.kid = num('kid_'+c); e.kidNames = val('kidn_'+c);
      }
      if(ev.extras.includes('guest')){ e.guest = num('gu_'+c); e.guestNames = val('gun_'+c); }
      if(ev.extras.includes('spouse')){
        const sp = val('sp_'+c);
        if(sp){ e.bjNames = sp; e.bj = sp.split(/[、,，\s]+/).filter(Boolean).length; }
      }
      if(ev.extras.includes('diet')) opt.push(radio('diet_'+c));
      if(ev.extras.includes('group')){
        const g = radio('grp_'+c);
        if(!g) return `${ev.tag} 請選擇組別`;
        e.group = g;
        const mate = val('mate_'+c);
        opt.push(g + (mate ? '｜隊友：' + mate : ''));
      }
      e.option = opt.filter(Boolean).join('，');
    }
    p.events.push(e);
  }
  if(!p.events.length) return '請至少在一個活動按「參加」或「不克參加」';
  return p;
}

$('#submitBtn').addEventListener('click', () => {
  if(!apiReady()){ showMsg('err', '尚未設定後台網址，請聯絡秘書。'); return; }
  const p = collect();
  if(typeof p === 'string'){ showMsg('err', esc(p)); return; }
  const btn = $('#submitBtn');
  btn.disabled = true; btn.textContent = '送出中，請稍候…';
  fetch(API_URL, { method:'POST', body: JSON.stringify(p) })
    .then(r => r.json())
    .then(d => {
      if(!d.ok) throw new Error(d.error || '送出失敗');
      const items = d.summary.map(s => `<li>${esc(s.title)}：${esc(s.status)}${s.fee ? `（費用試算 ${Number(s.fee).toLocaleString()} 元）` : ''}</li>`).join('');
      showMsg('ok', `報名成功，謝謝！<ul>${items}</ul>`);
      renderLists(d.lists);
      resetChoices();
      try{ localStorage.setItem('choumei_me', JSON.stringify({identity, nickname:val('nickname'), name:val('name'), gname:val('gname'), inviter:val('inviter')})); }catch(e){}
    })
    .catch(err => showMsg('err', '送出失敗：' + esc(err.message) + '<br>請再試一次，或直接聯絡秘書。'))
    .finally(() => { btn.disabled = false; btn.textContent = '確認送出'; });
});

function resetChoices(){
  Object.keys(choice).forEach(k => delete choice[k]);
  renderEvents();
  loadLists();
}

/* ======== 身分切換 ======== */
function setIdentity(v){
  identity = v;
  document.querySelectorAll('#identitySeg button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('#memberFields').classList.toggle('hide', v !== '社友');
  $('#guestFields').classList.toggle('hide', v === '社友');
  EVENTS.forEach(ev => updateFee(ev.code));
}
document.querySelectorAll('#identitySeg button').forEach(b => b.addEventListener('click', () => setIdentity(b.dataset.v)));

/* ======== 啟動 ======== */
['input','change'].forEach(t => $('#events').addEventListener(t, e => { const m = e.target.closest('.ev'); if(m) updateFee(m.id.slice(3)); }));
renderEvents();
if(!apiReady()) $('#configWarn').classList.remove('hide');
try{
  const me = JSON.parse(localStorage.getItem('choumei_me') || 'null');
  if(me){
    ['nickname','name','gname','inviter'].forEach(k => { if(me[k]) $('#'+k).value = me[k]; });
    if(me.identity) setIdentity(me.identity);
  }
}catch(e){}
loadLists();
</script>
</body>
</html>
